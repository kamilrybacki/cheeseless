name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces; the key is absent on other images.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Generated code and docs match proto/
        run: |
          uv run python scripts/gen_proto.py --check
          uv run python scripts/gen_errors_doc.py --check
      - run: uv run lint-imports
      - run: uv run pytest --cov
        env:
          CHEESELESS_REQUIRE_BWRAP: "1"

  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Install the pinned official Gitleaks release
        run: uv run python scripts/install_gitleaks.py --dest "$RUNNER_TEMP/bin"
      - name: Audit tracked tree, local history and built archives (redacted)
        run: |
          uv run python scripts/release_audit.py \
            --repo . \
            --gitleaks "$RUNNER_TEMP/bin/gitleaks" \
            --report-dir "$RUNNER_TEMP/release-audit"
