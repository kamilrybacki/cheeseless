// The only verbs the agent-reachable verifier exposes (Q43). Freeze, promote and
// disable are host CLI only and deliberately absent. Documentation of the contract;
// no gRPC transport is generated (protojson over a UDS).
syntax = "proto3";

package cheeseless.v1;

import "cheeseless/v1/error.proto";
import "cheeseless/v1/result.proto";

message RunRequest {
  string task_id = 1;
}

message RunResponse {
  oneof outcome {
    Result result = 1;
    Error error = 2;
  }
  // One CRITERION_FAILED per FAIL criterion of `result`, carrying only the frozen
  // public description (ledger I9, I10). Empty unless `result` is set.
  repeated Error criterion_failures = 3;
}

message StatusRequest {
  string task_id = 1;
}

message StatusResponse {
  oneof outcome {
    Result result = 1;
    Error error = 2;
  }
  // One CRITERION_FAILED per FAIL criterion of `result`, carrying only the frozen
  // public description (ledger I9, I10). Empty unless `result` is set.
  repeated Error criterion_failures = 3;
}

// Closed set of dispute reasons (ADR 0009). Never a Result status.
enum DisputeCode {
  DISPUTE_CODE_UNSPECIFIED = 0;
  DISPUTE_CODE_CONTRADICTS_SPEC = 1;
  DISPUTE_CODE_UNTESTABLE = 2;
  DISPUTE_CODE_AMBIGUOUS_SPEC = 3;
  DISPUTE_CODE_OTHER = 4;
}

message DisputeRequest {
  string task_id = 1;
  string criterion_id = 2;
  DisputeCode code = 3;
  string note = 4;
}

// Identical for every accepted dispute: no id, count or timestamp.
message DisputeAck {
  string message = 1;
}

message DisputeResponse {
  oneof outcome {
    DisputeAck ack = 1;
    Error error = 2;
  }
}

// Author-role operations (ADR 0009). Reachable only by an author session, never by
// an implementer; refused with ROLE_NOT_ALLOWED otherwise and closed once frozen.
// Approval, reference recording and retries are host CLI only and absent here.
message AuthorCheckRequest {
  string task_id = 1;
}

message AuthorCheckAck {
  bool ok = 1;
  // Public, redacted problems found in the author's acceptance tree.
  repeated string problems = 2;
  uint32 tests = 3;
}

message AuthorCheckResponse {
  oneof outcome {
    AuthorCheckAck check = 1;
    Error error = 2;
  }
}

message AuthorCrosscheckRequest {
  string task_id = 1;
}

message AuthorCrosscheckAck {
  bool green = 1;
  // Public criterion ids that failed against the reference.
  repeated string red_criteria = 2;
}

message AuthorCrosscheckResponse {
  oneof outcome {
    AuthorCrosscheckAck crosscheck = 1;
    Error error = 2;
  }
}

message FreezeProposeRequest {
  string task_id = 1;
}

message FreezeProposeAck {
  string proposal_id = 1;
}

message FreezeProposeResponse {
  oneof outcome {
    FreezeProposeAck proposal = 1;
    Error error = 2;
  }
}

// Closes the spec phase of a cheeseless dev session (ADR 0013). Dev author sessions only.
message SpecDoneRequest {
  string task_id = 1;
}

message SpecDoneAck {
  string spec_digest = 1;
}

message SpecDoneResponse {
  oneof outcome {
    SpecDoneAck ack = 1;
    Error error = 2;
  }
}

service Verifier {
  rpc Run(RunRequest) returns (RunResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Dispute(DisputeRequest) returns (DisputeResponse);
  rpc AuthorCheck(AuthorCheckRequest) returns (AuthorCheckResponse);
  rpc AuthorCrosscheck(AuthorCrosscheckRequest) returns (AuthorCrosscheckResponse);
  rpc FreezePropose(FreezeProposeRequest) returns (FreezeProposeResponse);
  rpc SpecDone(SpecDoneRequest) returns (SpecDoneResponse);
}
