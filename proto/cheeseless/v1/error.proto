// Agent-facing error model (ADR 0008, ledger Q50-Q52, D10).
syntax = "proto3";

package cheeseless.v1;

// Stable public error codes. New codes need an entry in docs/errors.md.
enum ErrorCode {
  // Fail closed: an unset code is never a valid answer.
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_RUN_BUDGET_EXHAUSTED = 1;
  ERROR_CODE_CRITERION_FAILED = 2;
  ERROR_CODE_BUILD_FAILED = 3;
  ERROR_CODE_PROMOTE_PATH_REJECTED = 4;
  ERROR_CODE_SENSITIVE_FILE_NEEDS_APPROVAL = 5;
  ERROR_CODE_EGRESS_DOMAIN_DENIED = 6;
  ERROR_CODE_EGRESS_SERVER_TOOL_DENIED = 7;
  ERROR_CODE_DLP_BLOCKED = 8;
  ERROR_CODE_INFRA_ERROR = 9;
  ERROR_CODE_RATE_LIMITED = 10;
  // Pre-hidden stages named in Q51.
  ERROR_CODE_IMPORT_FAILED = 11;
  ERROR_CODE_EXECUTABLE_MISSING = 12;
  ERROR_CODE_STARTUP_CRASH = 13;
  ERROR_CODE_SMOKE_TEST_FAILED = 14;
}

// Run budget as the agent may see it. Explicit presence: an unset count must not
// read as "0 runs left" (or as a zero limit).
message BudgetState {
  optional uint32 remaining = 1;
  optional uint32 limit = 2;
}

// Whitelisted detail fields only. Do not add free text, maps, Struct or Any here.
message ErrorDetails {
  string criterion_id = 1;
  // A path the agent itself wrote; never a path from hidden inputs.
  string agent_written_path = 2;
  BudgetState budget = 3;
  string host = 4;
}

message Error {
  ErrorCode code = 1;
  // Trusted template text; never contains hidden content.
  string reason = 2;
  string hint = 3;
  bool retryable = 4;
  ErrorDetails details = 5;
  // Anchor in docs/errors.md.
  string docs = 6;
  // DLP-scanned stderr tail (about 4 KB). ONLY set for stages before the first
  // hidden input (Q51); it must be empty once any hidden input has been read.
  string pre_hidden_stderr_tail = 7;
}
