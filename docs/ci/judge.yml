# cheeseless CI: the single trusted workflow template.
#   route -> policy (no PR code) + judge (gate/ only) + evaluate (advisory) -> post (the only
#   job that can publish checks). See docs/ci/README.md.
# Copy to .github/workflows/judge.yml in the protected repository. It is a `workflow_run`
# workflow, so GitHub always runs the copy on the DEFAULT branch, never the PR's version.
#
# Setup: see docs/ci/README.md. Everything secret lives in the `cheeseless-judge` environment,
# limited to the default branch. Never store these as repository secrets: any branch workflow a
# pusher writes can read those.
#
# TWO GitHub Apps, so that a sandbox escape in the judge cannot forge a green check:
#   - ledger App: Contents read/write, installed on the private ledger repository ONLY. Secret
#     CHEESELESS_LEDGER_APP_KEY, variable CHEESELESS_LEDGER_APP_ID (the App Client ID). It is the
#     only credential the judge job (which runs candidate code, sandboxed) can see.
#   - checks App: Checks read/write, installed on this repository ONLY, no Contents access. Secret
#     CHEESELESS_CHECKS_APP_KEY, variable CHEESELESS_CHECKS_APP_ID (the App Client ID). Minted only
#     in the `post` job, which never fetches, checks out or runs pull request code.
# Also: secret CHEESELESS_CI_BUNDLE (output of `cheeseless ci-export`) and variable
# CHEESELESS_BUDGET_REPO (name of the ledger repository, same owner).
# The token action revokes each token when its job ends.
name: cheeseless-judge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions: {}

# Only runs that route and judge identically share a group. A judge=no run (title/body edit) or a
# push-event ci run on the same SHA gets its own group, so it can never cancel the in-flight
# pull_request judge=yes run (which has already charged the budget) and then post nothing.
concurrency:
  group: >-
    cheeseless-judge-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.display_title }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  REPO: ${{ github.repository }}

jobs:
  # Holds no secrets and no environment. Resolves the live PR from the head SHA, verifies
  # its base, head and branch class (tested Python: `cheeseless ci-route`) and decides which
  # checks it gets. Only a gate/ PR is routed to the implementation judge.
  route:
    # ci.yml's run-name says `judge=no` for a title/body-only edit, so those do not re-spend budget.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.display_title == 'ci judge=yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      number: ${{ steps.route.outputs.number }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      run_judge: ${{ steps.route.outputs.run_judge }}
      branch_class: ${{ steps.route.outputs.branch_class }}
      # Attacker-controlled: only ever consumed through an env var, never a `run:` body.
      branch: ${{ steps.route.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Resolve and validate the pull request
        id: route
        run: |
          set -euo pipefail
          # Never trust PR numbers carried in the event payload; resolve from the SHA.
          gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" > prs.json
          uv run cheeseless ci-route --head "$HEAD_SHA" --default-branch "$DEFAULT_BRANCH" \
            --repo "$REPO" \
            < prs.json > route.json
          jq -r '"number=\(.number)", "base_sha=\(.base_sha)", "run_judge=\(.run_judge)", "branch_class=\(.branch_class)", "branch=\(.branch)"' \
            route.json >> "$GITHUB_OUTPUT"

  judge:
    needs: route
    if: needs.route.outputs.run_judge == 'true'
    runs-on: ubuntu-latest
    # Environment secrets reach only jobs that name the environment, and only on the
    # branches it allows (configure: default branch only, no tags).
    environment: cheeseless-judge
    # GITHUB_TOKEN is read-only. This job runs candidate code (sandboxed) and so never receives
    # the checks credential: the verdict is handed to `post` as an artifact plus the exit code.
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.route.outputs.number }}
    outputs:
      code: ${{ steps.judge.outputs.code }}
    steps:
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"

      - name: Install cheeseless (default branch)
        run: uv sync --locked

      - name: Fetch the PR head as objects only
        run: |
          set -euo pipefail
          # No checkout of PR content: only the objects, addressed by SHA.
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/cheeseless/pr-head"
          [ "$(git rev-parse refs/cheeseless/pr-head)" = "$HEAD_SHA" ] || { echo "head moved"; exit 1; }

      # The cross-run CI budget lives on a ledger branch in the private ledger repository.
      # This token can append to it and nothing else: contents write, ledger repository only.
      - name: Mint the budget ledger token
        id: budget
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHEESELESS_LEDGER_APP_ID }}
          private-key: ${{ secrets.CHEESELESS_LEDGER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.CHEESELESS_BUDGET_REPO }}
          permission-contents: write

      # ci-judge removes CHEESELESS_BUDGET_TOKEN from its environment before any sandbox
      # exists, and the sandbox clears the environment. GITHUB_REPOSITORY_ID, GITHUB_RUN_ID
      # and GITHUB_RUN_ATTEMPT come from the runner and key the budget charge.
      - name: Judge
        id: judge
        env:
          CHEESELESS_CI_BUNDLE: ${{ secrets.CHEESELESS_CI_BUNDLE }}
          CHEESELESS_BUDGET_TOKEN: ${{ steps.budget.outputs.token }}
        run: |
          set +e
          judged_base=$(git rev-parse "origin/${DEFAULT_BRANCH}")
          uv run cheeseless ci-judge --base "$judged_base" --head "$HEAD_SHA" --json > verdict.json
          code=$?
          # Record the default-branch tip this verdict was judged against; post compares it with
          # the tip at publish time so a stale pass cannot survive a moved base.
          jq --arg b "$judged_base" '. + {judged_base: $b}' verdict.json > verdict.tmp \
            && mv verdict.tmp verdict.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Revoke the budget token as soon as the judge is done, whatever happened. A failed
      # revoke changes no verdict; the token action retries at job end and it expires anyway.
      - name: Revoke the budget ledger token
        id: revoke-budget
        if: always()
        env:
          GH_TOKEN: ${{ steps.budget.outputs.token }}
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh api installation/token -X DELETE --silent \
            || echo "::warning::budget token revoke failed; it is revoked again at job end"

      - name: Hand the verdict to the post job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verdict
          path: verdict.json
          if-no-files-found: ignore

  # Decides the branch class and path confinement. It checks out the default branch and fetches
  # PR objects, but executes NO PR content: no bwrap, no author check, only tree comparison. No
  # environment, no secrets. Its result reaches `post` as a job output, which a sandboxed job
  # (evaluate, judge) cannot write.
  policy:
    needs: route
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.route.outputs.number }}
      BRANCH: ${{ needs.route.outputs.branch }}
    outputs:
      payload: ${{ steps.policy.outputs.payload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch the PR head as objects only
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/cheeseless/pr-head"
          [ "$(git rev-parse refs/cheeseless/pr-head)" = "$HEAD_SHA" ] || { echo "head moved"; exit 1; }
      - name: Decide the branch policy
        id: policy
        run: |
          set -euo pipefail
          uv run cheeseless ci-branch --branch "$BRANCH" --head "$HEAD_SHA" \
            --base "$(git rev-parse "origin/${DEFAULT_BRANCH}")" --check-payload --no-author-check \
            > payload.json
          # One compact line (control characters are escaped), safe for $GITHUB_OUTPUT.
          echo "payload=$(jq -c . payload.json)" >> "$GITHUB_OUTPUT"

  # Advisory only, unprivileged: no environment, no secrets, no App credential. It runs the
  # sandboxed author check, which executes PR acceptance content, so NOTHING it produces is
  # consumed by `post`: it cannot turn the gate green, only inform a human reading the log.
  evaluate:
    needs: route
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.route.outputs.number }}
      BRANCH: ${{ needs.route.outputs.branch }}
    steps:
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch the PR head as objects only
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/cheeseless/pr-head"
          [ "$(git rev-parse refs/cheeseless/pr-head)" = "$HEAD_SHA" ] || { echo "head moved"; exit 1; }
      - name: Advisory author check
        run: |
          uv run cheeseless ci-branch --branch "$BRANCH" --head "$HEAD_SHA" \
            --base "$(git rev-parse "origin/${DEFAULT_BRANCH}")" --json || true

  # The only job that can publish checks. It has the environment and the checks App key, and
  # checks out only the default branch: it never fetches or executes pull request code. `ci-gate`
  # validates the policy payload (from `policy`'s output) and the verdict, requires the verdict to
  # have been judged against the current default-branch tip, and folds everything into the single
  # required "cheeseless gate" check (plus the informational judge and branch policy checks).
  post:
    needs: [route, policy, judge, evaluate]
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    environment: cheeseless-judge
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.route.outputs.number }}
      BRANCH_CLASS: ${{ needs.route.outputs.branch_class }}
      JUDGE_CODE: ${{ needs.judge.outputs.code }}
      POLICY_PAYLOAD: ${{ needs.policy.outputs.payload }}
      POLICY_RESULT: ${{ needs.policy.result }}
      JUDGE_RESULT: ${{ needs.judge.result }}
      EVALUATE_RESULT: ${{ needs.evaluate.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: verdict
          path: in
      - name: Build the check bodies
        run: |
          set -euo pipefail
          mkdir -p in
          printf '%s' "$POLICY_PAYLOAD" > in/payload.json
          # Second guard: every upstream job must have ended as this class needs. The judge
          # runs only for gate/; elsewhere it must have been skipped.
          guards=true
          [ "$POLICY_RESULT" = success ] || guards=false
          # evaluate is advisory: shown, never a guard, so an install flake cannot fail the gate.
          echo "evaluate (advisory): $EVALUATE_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$BRANCH_CLASS" = gate ]; then
            [ "$JUDGE_RESULT" = success ] || guards=false
          else
            [ "$JUDGE_RESULT" = skipped ] || guards=false
          fi
          CURRENT_BASE=$(git rev-parse HEAD)
          uv run cheeseless ci-gate --head "$HEAD_SHA" --branch-class "$BRANCH_CLASS" \
            --policy in/payload.json --judge-code "$JUDGE_CODE" --verdict in/verdict.json \
            --current-base "$CURRENT_BASE" --guards-ok "$guards" > checks.json
      - name: Mint the checks App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHEESELESS_CHECKS_APP_ID }}
          private-key: ${{ secrets.CHEESELESS_CHECKS_APP_KEY }}
          permission-checks: write
      - name: Post the checks
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-check that the PR head is unchanged before posting (read-only token).
          current=$(GH_TOKEN="$READ_TOKEN" gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "PR head changed; not posting"; exit 1; }
          # Informational checks first; the required gate check last, so it appears only
          # once the others are in. Every body is success or failure, never neutral/skipped.
          jq -c '.[1:][], .[0]' checks.json | while read -r body; do
            printf '%s' "$body" | gh api "repos/${REPO}/check-runs" -X POST --input -
          done
