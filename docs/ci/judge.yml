# cheeseless CI: the single trusted workflow template (route, then judge for gate/ PRs, or
# the branch-policy check for spec/ and unknown classes; see docs/ci/README.md).
# Copy to .github/workflows/judge.yml in the
# protected repository. It is a `workflow_run` workflow, so GitHub always runs the copy on
# the DEFAULT branch, never the version from the pull request.
#
# Setup: see docs/ci/README.md. Everything secret lives in the `cheeseless-judge` environment,
# limited to the default branch: secrets CHEESELESS_CI_BUNDLE (output of `cheeseless ci-export`)
# and CHEESELESS_JUDGE_APP_KEY, variables CHEESELESS_JUDGE_APP_CLIENT_ID and
# CHEESELESS_BUDGET_REPO (name of the private ledger repository, same owner). Never store them
# as repository secrets: any branch workflow a pusher writes can read those.
#
# Two short-lived judge App tokens, never both alive next to the candidate:
#   - budget token: contents write on the ledger repository only, minted right before the
#     judge, given only to the judge step and revoked right after it;
#   - checks token: checks write on this repository, minted only after the judge.
# The token action also revokes each token when the job ends.
name: cheeseless-judge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions: {}

concurrency:
  group: cheeseless-judge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  REPO: ${{ github.repository }}

jobs:
  # Holds no secrets and no environment. Resolves the live PR from the head SHA, verifies
  # its base, head and branch class (tested Python: `cheeseless ci-route`) and decides which
  # checks it gets. Only a gate/ PR is routed to the implementation judge.
  route:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      number: ${{ steps.route.outputs.number }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      run_judge: ${{ steps.route.outputs.run_judge }}
      # Attacker-controlled: only ever consumed through an env var, never a `run:` body.
      branch: ${{ steps.route.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Resolve and validate the pull request
        id: route
        run: |
          set -euo pipefail
          # Never trust PR numbers carried in the event payload; resolve from the SHA.
          gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" > prs.json
          uv run cheeseless ci-route --head "$HEAD_SHA" --default-branch "$DEFAULT_BRANCH" \
            --repo "$REPO" \
            < prs.json > route.json
          jq -r '"number=\(.number)", "base_sha=\(.base_sha)", "run_judge=\(.run_judge)", "branch=\(.branch)"' \
            route.json >> "$GITHUB_OUTPUT"

  judge:
    needs: route
    if: needs.route.outputs.run_judge == 'true'
    runs-on: ubuntu-latest
    # Environment secrets reach only jobs that name the environment, and only on the
    # branches it allows (configure: default branch only, no tags).
    environment: cheeseless-judge
    # GITHUB_TOKEN is read-only. The verdict is posted by the dedicated judge App, so a
    # pusher's own workflow (shared github-actions app) cannot forge the required check.
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.route.outputs.number }}
    steps:
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"

      - name: Install cheeseless (default branch)
        run: uv sync --locked

      - name: Fetch the PR head as objects only
        run: |
          set -euo pipefail
          # No checkout of PR content: only the objects, addressed by SHA.
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/cheeseless/pr-head"
          [ "$(git rev-parse refs/cheeseless/pr-head)" = "$HEAD_SHA" ] || { echo "head moved"; exit 1; }

      # The cross-run CI budget lives on a ledger branch in the private ledger repository.
      # This token can append to it and nothing else: contents write, ledger repository only.
      - name: Mint the budget ledger token
        id: budget
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHEESELESS_JUDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHEESELESS_JUDGE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.CHEESELESS_BUDGET_REPO }}
          permission-contents: write

      # ci-judge removes CHEESELESS_BUDGET_TOKEN from its environment before any sandbox
      # exists, and the sandbox clears the environment. GITHUB_REPOSITORY_ID, GITHUB_RUN_ID
      # and GITHUB_RUN_ATTEMPT come from the runner and key the budget charge.
      - name: Judge
        id: judge
        env:
          CHEESELESS_CI_BUNDLE: ${{ secrets.CHEESELESS_CI_BUNDLE }}
          CHEESELESS_BUDGET_TOKEN: ${{ steps.budget.outputs.token }}
        run: |
          set +e
          uv run cheeseless ci-judge --base "$(git rev-parse "origin/${DEFAULT_BRANCH}")" \
            --head "$HEAD_SHA" --json > verdict.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Revoke the budget token as soon as the judge is done, whatever happened. A failed
      # revoke changes no verdict; the token action retries at job end and it expires anyway.
      - name: Revoke the budget ledger token
        id: revoke-budget
        if: always()
        env:
          GH_TOKEN: ${{ steps.budget.outputs.token }}
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh api installation/token -X DELETE --silent \
            || echo "::warning::budget token revoke failed; it is revoked again at job end"

      # Minted only after the judge has finished, so the candidate run never coexists with
      # the App credentials. Checks write only; revoked when the job ends.
      - name: Mint the judge App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHEESELESS_JUDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHEESELESS_JUDGE_APP_KEY }}
          permission-checks: write

      - name: Post the check run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-check that the PR head is unchanged before posting (read-only token).
          current=$(GH_TOKEN="$READ_TOKEN" gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "PR head changed; not posting"; exit 1; }
          # Fail closed: success only on exit 0 AND a verdict whose status is "pass".
          # Anything else (FAIL, BLOCKED, usage/infra error, freeze drift) is a failure.
          status=$(jq -r '.status // empty' verdict.json 2>/dev/null || true)
          if [ "${{ steps.judge.outputs.code }}" = "0" ] && [ "$status" = "pass" ]; then
            conclusion=success
          else
            conclusion=failure
          fi
          summary=$(jq -c '{status, criteria}' verdict.json 2>/dev/null || echo '{}')
          gh api "repos/${REPO}/check-runs" -X POST \
            -f name="cheeseless judge" -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$conclusion" \
            -f "output[title]=cheeseless judge: ${conclusion}" \
            -f "output[summary]=${summary}"

  # Every validated PR gets this check: path confinement for gate/ and spec/, a failure for
  # any other class. It is published on the validated head by the judge App, like the judge
  # check, and is never an implementation verdict.
  branch-policy:
    needs: route
    runs-on: ubuntu-latest
    environment: cheeseless-judge
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.route.outputs.number }}
      BRANCH: ${{ needs.route.outputs.branch }}
    steps:
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch the PR head as objects only
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/cheeseless/pr-head"
          [ "$(git rev-parse refs/cheeseless/pr-head)" = "$HEAD_SHA" ] || { echo "head moved"; exit 1; }
      # No App credential exists while the (sandboxed) advisory author check runs.
      - name: Evaluate the branch policy
        run: |
          set +e
          uv run cheeseless ci-branch --branch "$BRANCH" --head "$HEAD_SHA" \
            --base "$(git rev-parse "origin/${DEFAULT_BRANCH}")" --check-payload > payload.json
          # Fail closed: a missing or foreign payload becomes a failing check.
          if ! jq -e --arg sha "$HEAD_SHA" '.head_sha == $sha and (.conclusion | IN("success", "failure"))' \
              payload.json > /dev/null 2>&1; then
            jq -n --arg sha "$HEAD_SHA" '{name: "cheeseless branch policy", head_sha: $sha,
              status: "completed", conclusion: "failure",
              output: {title: "cheeseless branch policy: failure", summary: "the policy check did not complete"}}' \
              > payload.json
          fi
          exit 0
      - name: Mint the judge App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHEESELESS_JUDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHEESELESS_JUDGE_APP_KEY }}
          permission-checks: write
      - name: Post the check run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(GH_TOKEN="$READ_TOKEN" gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "PR head changed; not posting"; exit 1; }
          gh api "repos/${REPO}/check-runs" -X POST --input payload.json
