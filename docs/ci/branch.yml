# cheeseless branch-class check: workflow template. Copy to .github/workflows/branch.yml.
# Like judge.yml it is a `workflow_run` workflow, so GitHub runs the DEFAULT-branch copy and
# never the one from the pull request. It holds no secrets and mints no token.
#
# Branch classes (ADR 0009):
#   gate/<task>     implementer PRs. Must not touch acceptance/ (the judge covers the rest).
#   spec/<lineage>  author PRs. May touch acceptance/ only; also gets the advisory author
#                   check (reported, never failing, and no implementation verdict).
#   anything else   rejected.
# All decisions are made by `cheeseless ci-branch` (tested Python), not by this YAML. The
# branch name is attacker-controlled: it only ever reaches the shell through an env var.
name: cheeseless-branch

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions: {}

concurrency:
  group: cheeseless-branch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'gate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch the PR head as objects only
        run: git fetch --no-tags origin "+${{ github.event.workflow_run.head_sha }}:refs/cheeseless/pr-head"
      - name: Gate PRs never touch acceptance/
        run: |
          uv run cheeseless ci-branch --branch "$BRANCH" --head "$HEAD_SHA" \
            --base "$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"

  author:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'spec/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Fetch the PR head as objects only
        run: git fetch --no-tags origin "+${{ github.event.workflow_run.head_sha }}:refs/cheeseless/pr-head"
      - name: Author PRs touch acceptance/ only; advisory author check
        run: |
          uv run cheeseless ci-branch --branch "$BRANCH" --head "$HEAD_SHA" \
            --base "$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"

  unknown-class:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      !startsWith(github.event.workflow_run.head_branch, 'gate/') &&
      !startsWith(github.event.workflow_run.head_branch, 'spec/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject unknown branch classes
        run: |
          echo "refused: branch class not recognised (expected gate/<task> or spec/<lineage>)"
          exit 1
